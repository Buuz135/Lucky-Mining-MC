plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.1' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

configure([project(':fabric'), project(':neoforge')]) {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    version = rootProject.version
    group = rootProject.group

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version)
        withSourcesJar()
    }

    sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
    sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

    tasks.withType(JavaCompile).configureEach {
        options.release = java_version as int
        options.encoding = 'UTF-8'
    }

    processResources {
        def expandProps = [
                version: version,
                minecraft_version: minecraft_version,
                minecraft_version_range: minecraft_version_range,
                fabric_version: fabric_version,
                fabric_loader_version: fabric_loader_version,
                mod_name: mod_name,
                mod_author: mod_author,
                mod_id: mod_id,
                license: license,
                description: project.findProperty('description'),
                neoforge_version: neoforge_version,
                credits: credits,
                java_version: java_version
        ]

        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                    'Specification-Title': mod_name,
                    'Specification-Vendor': mod_author,
                    'Specification-Version': project.version,
                    'Implementation-Title': project.name,
                    'Implementation-Version': project.version,
                    'Implementation-Vendor': mod_author,
                    'Built-On-Minecraft': minecraft_version
            ])
        }
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
